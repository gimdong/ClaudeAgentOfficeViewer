<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" role="img" aria-labelledby="fig-err-401-t fig-err-401-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-err-401-t">증상: 터미널에서 claude-office로 열어 주세요</title>
<desc id="fig-err-401-d">접속 열쇠 없이 대시보드 주소를 열면 셔터에 '열쇠 필요' 팻말이 걸린 화면이 나옵니다. 터미널에서 claude-office를 한 번 더 실행하면 열립니다.</desc>
<rect x="0" y="0" width="640" height="432" fill="#12111f"/><rect x="1" y="1" width="638" height="430" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="16" y="16" width="608" height="400" fill="#12111f" stroke="#3b3460" stroke-width="2"/><rect x="17" y="17" width="606" height="30" fill="#241f40"/><rect x="28" y="28" width="8" height="8" fill="#ff5fa2"/><rect x="42" y="28" width="8" height="8" fill="#fff7a8"/><rect x="56" y="28" width="8" height="8" fill="#39ffb6"/><rect x="90" y="23" width="360" height="18" fill="#0b0a17"/><text x="100" y="36" font-size="11" fill="#9d97c7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace">http://127.0.0.1:4317/</text><rect x="240" y="80" width="160" height="6" fill="#4a4470"/><rect x="240" y="86" width="160" height="2" fill="#2a2548"/><rect x="240" y="88" width="160" height="6" fill="#4a4470"/><rect x="240" y="94" width="160" height="2" fill="#2a2548"/><rect x="240" y="96" width="160" height="6" fill="#4a4470"/><rect x="240" y="102" width="160" height="2" fill="#2a2548"/><rect x="240" y="104" width="160" height="6" fill="#4a4470"/><rect x="240" y="110" width="160" height="2" fill="#2a2548"/><rect x="240" y="112" width="160" height="6" fill="#4a4470"/><rect x="240" y="118" width="160" height="2" fill="#2a2548"/><rect x="240" y="120" width="160" height="6" fill="#4a4470"/><rect x="240" y="126" width="160" height="2" fill="#2a2548"/><rect x="240" y="128" width="160" height="6" fill="#4a4470"/><rect x="240" y="134" width="160" height="2" fill="#2a2548"/><rect x="240" y="136" width="160" height="6" fill="#4a4470"/><rect x="240" y="142" width="160" height="2" fill="#2a2548"/><rect x="240" y="144" width="160" height="6" fill="#4a4470"/><rect x="240" y="150" width="160" height="2" fill="#2a2548"/><rect x="240" y="152" width="160" height="6" fill="#4a4470"/><rect x="240" y="158" width="160" height="2" fill="#2a2548"/><rect x="240" y="160" width="160" height="6" fill="#4a4470"/><rect x="240" y="166" width="160" height="2" fill="#2a2548"/><rect x="240" y="168" width="160" height="6" fill="#5d568f"/><rect x="284" y="100" width="2" height="10" fill="#ffd84a"/><rect x="354" y="100" width="2" height="10" fill="#ffd84a"/><g transform="rotate(-3 320 124)"><rect x="274" y="110" width="92" height="26" fill="#fff7a8"/><text x="320" y="128" font-size="14" fill="#1d1b33" font-weight="700" text-anchor="middle">열쇠 필요</text></g><text x="320" y="214" font-size="18" fill="#e8e4ff" text-anchor="middle">터미널에서 <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" fill="#39ffb6">claude-office</tspan>로 열어 주세요</text><text x="320" y="246" font-size="13" fill="#9d97c7" text-anchor="middle">이 화면은 접속 열쇠가 있어야 볼 수 있습니다. 터미널에서</text><text x="320" y="267" font-size="13" fill="#9d97c7" text-anchor="middle">claude-office를 실행하면 열쇠가 담긴 주소로 브라우저가 열립니다.</text><text x="320" y="288" font-size="13" fill="#9d97c7" text-anchor="middle"></text><text x="320" y="309" font-size="13" fill="#9d97c7" text-anchor="middle">북마크로 열었는데 이 화면이 보이면, 터미널에서 한 번만 다시 열어</text><text x="320" y="330" font-size="13" fill="#9d97c7" text-anchor="middle">주세요. 그 뒤로는 북마크로 열립니다.</text><rect x="250" y="363" width="140" height="32" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><text x="320" y="384" font-size="13" fill="#e8e4ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace">$ claude-office</text>
</svg>
