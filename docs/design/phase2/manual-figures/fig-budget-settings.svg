<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 383" role="img" aria-labelledby="fig-budget-settings-t fig-budget-settings-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-budget-settings-t">예산 설정 창</title>
<desc id="fig-budget-settings-d">설정 단추를 누르면 이 층의 예산과 새 층의 기본값을 정하는 창이 열립니다. 비워 두면 예산 없음입니다.</desc>
<rect x="0" y="0" width="640" height="383" fill="#12111f"/><rect x="1" y="1" width="638" height="381" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="110" y="16" width="420" height="351" fill="#0e0d18"/><rect x="110" y="16" width="420" height="351" fill="none" stroke="#3b3460" stroke-width="4"/><text x="130" y="53" font-size="17" fill="#e8e4ff" font-weight="700">fake-shop 예산</text><text x="130" y="86" font-size="12" fill="#e8e4ff">이 층의 예산</text><rect x="130" y="92" width="340" height="32" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><text x="140" y="113" font-size="14" fill="#e8e4ff">500,000</text><text x="478" y="113" font-size="12" fill="#9d97c7">토큰</text><text x="130" y="142" font-size="12" fill="#9d97c7">지금까지 쓴 양 312,340 토큰</text><text x="130" y="161" font-size="12" fill="#9d97c7">비워 두면 예산 없음. 1,000 ~ 1,000,000,000</text><text x="130" y="190" font-size="12" fill="#e8e4ff">새 층의 기본값</text><rect x="130" y="196" width="340" height="32" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><text x="140" y="217" font-size="14" fill="#e8e4ff"></text><text x="478" y="217" font-size="12" fill="#9d97c7">토큰</text><text x="130" y="246" font-size="12" fill="#9d97c7">앞으로 새로 생기는 층에 적용됩니다. 지금 있는 층은 바뀌지 않습니다.</text><text x="130" y="269" font-size="12" fill="#9d97c7">처음 저장할 때 브라우저가 알림을 허용할지 묻습니다. 거절해도</text><text x="130" y="288.2" font-size="12" fill="#9d97c7">층 경광등은 켜집니다.</text><g><rect x="386" y="311" width="58" height="36" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="415" y="334.5" font-size="13" fill="#e8e4ff" text-anchor="middle">취소</text></g><g><rect x="452" y="311" width="58" height="36" fill="#39ffb6"/><text x="481" y="334.5" font-size="13" fill="#1d1b33" font-weight="700" text-anchor="middle">저장</text></g>
</svg>
