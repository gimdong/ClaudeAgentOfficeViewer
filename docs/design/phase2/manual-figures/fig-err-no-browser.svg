<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 156" role="img" aria-labelledby="fig-err-no-browser-t fig-err-no-browser-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-err-no-browser-t">증상: 브라우저가 안 열리고 터미널에 주소가 나옴</title>
<desc id="fig-err-no-browser-d">claude-office가 브라우저를 열지 못하면 터미널에 열쇠가 담긴 주소가 나옵니다. 그 주소를 복사해 브라우저에 붙여 넣습니다. 이 주소는 남에게 보내지 않습니다.</desc>
<rect x="0" y="0" width="640" height="156" fill="#12111f"/><rect x="1" y="1" width="638" height="154" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="16" y="16" width="608" height="124" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><rect x="17" y="17" width="606" height="24" fill="#241f40"/><rect x="26" y="25" width="8" height="8" fill="#ff5fa2"/><rect x="40" y="25" width="8" height="8" fill="#fff7a8"/><rect x="54" y="25" width="8" height="8" fill="#39ffb6"/><text x="320" y="33" font-size="11" fill="#9d97c7" text-anchor="middle">터미널</text><text x="28" y="67" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ claude-office</text><rect x="20" y="73" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="87" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">브라우저를 열지 못했습니다. 이 주소를 브라우저에 붙여 넣어 주세요:</text><rect x="20" y="93" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="107" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">http://127.0.0.1:4317/?k=aaaaaaaa…</text><rect x="20" y="113" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="127" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">이 주소는 열쇠입니다. 남에게 보내지 마세요.</text>
