<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="fig-decision-result-t fig-decision-result-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-decision-result-t">답한 뒤 보이는 한 줄</title>
<desc id="fig-decision-result-d">답한 뒤 보고서 위쪽에 결과 한 줄이 나옵니다: 대시보드에서 허용함, 터미널에서 이미 답함, 시간이 지나 터미널로 넘어감. 3초 뒤 다음 결정으로 넘어가거나 닫힙니다.</desc>
<rect x="0" y="0" width="640" height="240" fill="#12111f"/><rect x="1" y="1" width="638" height="238" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="16" y="20" width="380" height="40" fill="none" stroke="#39ffb6" stroke-width="2"/><text x="28" y="45" font-size="13" fill="#39ffb6">대시보드에서 허용함</text><g><rect x="326" y="27" width="60" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="356" y="44.5" font-size="11" fill="#e8e4ff" text-anchor="middle">닫기</text></g><text x="412" y="45" font-size="12" fill="#9d97c7">대시보드에서 답한 경우</text><rect x="16" y="84" width="380" height="40" fill="none" stroke="#fff7a8" stroke-width="2"/><text x="28" y="109" font-size="13" fill="#fff7a8">터미널에서 이미 답함</text><g><rect x="326" y="91" width="60" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="356" y="108.5" font-size="11" fill="#e8e4ff" text-anchor="middle">닫기</text></g><text x="412" y="109" font-size="12" fill="#9d97c7">Claude Code 창에서 먼저 답한 경우</text><rect x="16" y="148" width="380" height="40" fill="none" stroke="#fff7a8" stroke-width="2"/><text x="28" y="173" font-size="13" fill="#fff7a8">시간이 지나 터미널로 넘어감</text><g><rect x="326" y="155" width="60" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="356" y="172.5" font-size="11" fill="#e8e4ff" text-anchor="middle">닫기</text></g><text x="412" y="173" font-size="12" fill="#9d97c7">10분 안에 답하지 않은 경우</text><text x="16" y="220" font-size="13" fill="#e8e4ff">3초 뒤 다음 결정으로 넘어가거나 보고서가 닫힙니다.</text>
</svg>
