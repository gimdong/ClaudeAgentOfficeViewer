<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>진단 패널 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
/* Phase 1 토큰(web/styles.css와 같음) + 베타 추가 토큰 --red */
:root {
  color-scheme: dark;
  --bg: #12111f; --wall: #1d1b33; --floor: #2a2446; --desk: #3b3460; --desk-dark: #241f40;
  --panel: #0e0d18; --ink: #e8e4ff; --muted: #9d97c7;
  --green: #39ffb6; --pink: #ff5fa2; --cyan: #3fd0ff; --violet: #b98cff; --yellow: #fff7a8; --yellow-deep: #ffd84a;
  --slab: #0b0a17; --focus: #3fd0ff;
  --red: #ff5a5a;            /* 베타 추가: 오류·실패 */
  --font-pixel: "Galmuri11", ui-monospace, "SF Mono", Menlo, monospace;
  --font-text: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --drawer-w: 440px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--font-pixel); font-size: 12px; line-height: 1.5; }
button, a { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.px { display: block; shape-rendering: crispEdges; }
.app { max-width: 1200px; margin: 0 auto; padding: 16px; }

/* 시안 조작 (제품에 없음) */
.proto { border: 2px dashed var(--desk); padding: 10px 12px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 11px; color: var(--muted); }
.proto select { background: var(--panel); border: 2px solid var(--desk); color: var(--ink); }

/* HUD (Phase 1 그대로) */
.hud { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; background: var(--panel); border: 2px solid var(--desk); padding: 10px 12px; margin-bottom: 16px; position: sticky; top: 0; z-index: 20; }
.counter .label { font-size: 11px; color: var(--muted); }
.counter .value { font-size: 18px; color: var(--green); }
.q-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--yellow); color: var(--wall); border: 0; padding: 4px 10px 4px 6px; cursor: pointer; box-shadow: 0 2px 0 var(--yellow-deep); }
.live { margin-left: auto; color: var(--green); font-size: 12px; }

/* ───── 진단 칩 ───── */
.diag-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 6px; background: var(--panel); color: var(--ink); border: 2px solid var(--desk); box-shadow: 0 2px 0 var(--slab); cursor: pointer; font-size: 12px; }
.diag-chip:hover { border-color: var(--cyan); }
.diag-chip:active { transform: translateY(2px); box-shadow: none; }
.diag-chip[aria-expanded="true"] { border-color: var(--cyan); }
.diag-chip svg { width: 14px; height: 14px; }
.diag-dot { position: absolute; top: -5px; right: -5px; width: 8px; height: 8px; background: var(--red); box-shadow: 0 0 0 2px var(--panel), 0 0 6px var(--red); }

/* ───── 진단 패널 (오른쪽 서랍) ───── */
.diag-panel { position: fixed; z-index: 50; top: 0; right: 0; bottom: 0; width: var(--drawer-w); max-width: 100vw; background: var(--panel); border-left: 4px solid var(--cyan); box-shadow: -8px 0 0 rgba(11,10,23,.6); display: flex; flex-direction: column; animation: slide-in .16s steps(4) both; }
.diag-panel[hidden] { display: none; }
@keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.dp-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px; border-bottom: 2px solid var(--desk); flex: none; }
.dp-head svg.ico { width: 20px; height: 20px; }
.dp-title { margin: 0; font-family: var(--font-text); font-size: 17px; font-weight: 700; }
.dp-checked { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.icon-btn { width: 28px; height: 28px; background: none; border: 2px solid var(--desk); cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.icon-btn:hover { border-color: var(--cyan); }
.icon-btn svg { width: 14px; height: 14px; }
.dp-scroll { flex: 1; overflow-y: auto; padding: 0 14px 16px; }
.dp-sec { padding: 12px 0; border-bottom: 1px dashed var(--desk); }
.dp-sec:last-child { border-bottom: 0; }
.dp-sec h3 { margin: 0 0 6px; font-size: 11px; font-weight: normal; color: var(--muted); }

.dp-verdict { display: flex; align-items: center; gap: 8px; font-family: var(--font-text); font-size: 15px; font-weight: 700; }
.dp-verdict svg { width: 16px; height: 16px; }
.dp-verdict.fail { color: var(--red); } .dp-verdict.warn { color: var(--yellow); } .dp-verdict.ok { color: var(--green); }
.dp-line { margin: 0; font-family: var(--font-text); font-size: 13px; line-height: 1.6; }
.dp-line b { font-weight: 700; }
.dp-line.err b { color: var(--red); }
.dp-sub { margin: 2px 0 0; font-size: 11px; color: var(--muted); word-break: break-all; }

.dp-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.dp-row { display: grid; grid-template-columns: 16px 1fr; gap: 2px 8px; padding: 8px 10px; border: 2px solid var(--desk); }
.dp-row svg { width: 14px; height: 14px; margin-top: 2px; }
.dp-row .t { font-size: 12px; }
.dp-row .d { grid-column: 2; font-family: var(--font-text); font-size: 12px; color: var(--muted); }
.dp-row .f { grid-column: 2; font-family: var(--font-text); font-size: 13px; margin-top: 2px; }
.dp-row .f::before { content: "고치는 법 "; font-family: var(--font-pixel); font-size: 11px; color: var(--muted); }
.dp-row--fail { border-color: var(--red); }
.dp-row--warn { border-color: var(--yellow); border-style: dashed; }
.dp-row--ok { padding: 4px 10px; border-color: transparent; background: #15132a; }
.dp-row--ok .t { color: var(--muted); }
.dp-row--ok .d { grid-column: auto; grid-row: 1; justify-self: end; }
.dp-row--ok { grid-template-columns: 16px 1fr auto; }

.dp-note { margin: 0 0 10px; font-family: var(--font-text); font-size: 13px; line-height: 1.6; color: var(--muted); }
.pbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; background: var(--panel); border: 2px solid var(--desk); box-shadow: 0 2px 0 var(--slab); cursor: pointer; font-size: 13px; text-decoration: none; white-space: nowrap; }
.pbtn:hover { border-color: var(--cyan); }
.pbtn:active { transform: translateY(2px); box-shadow: none; }
.pbtn svg { width: 14px; height: 14px; }
.pbtn--primary { background: var(--green); color: var(--wall); border-color: var(--green); }
.pbtn--primary:hover { border-color: var(--ink); }
.pbtn:disabled { opacity: .5; cursor: progress; transform: none; }
.dp-result { margin-top: 10px; padding: 8px 10px; border: 2px solid var(--green); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.dp-result p { margin: 0; font-family: var(--font-text); font-size: 13px; color: var(--green); }
.dp-result .name { grid-column: 1; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; color: var(--ink); word-break: break-all; }
.dp-result .pbtn { grid-column: 2; grid-row: 1 / 3; height: 32px; }
.dp-fail { margin-top: 10px; padding: 8px 10px; border: 2px solid var(--red); color: var(--red); font-family: var(--font-text); font-size: 13px; line-height: 1.6; }
.dp-fail code { color: var(--ink); }
.dp-state { padding: 24px 0; text-align: center; font-family: var(--font-text); font-size: 13px; color: var(--muted); }
.dp-state.err { color: var(--red); }
.dp-state .pbtn { margin-top: 10px; }

@media (max-width: 720px) {
  .diag-panel { width: 100vw; top: 8vh; border-left: 0; border-top: 4px solid var(--cyan); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="proto" aria-label="시안 조작 (제품에는 없음)">
    <label>최근 1시간 오류 <select id="p-err"><option value="0">0건 (점 없음)</option><option value="3" selected>3건 (빨간 점)</option></select></label>
    <label>패널 내용 <select id="p-data"><option value="mixed">fail·warn·ok 섞임</option><option value="allok">모두 정상</option><option value="loading">불러오는 중</option><option value="fetcherr">불러오기 실패</option></select></label>
    <label>진단 파일 <select id="p-bundle"><option value="idle">기본</option><option value="busy">만드는 중</option><option value="done">완료</option><option value="fail">실패</option></select></label>
  </section>

  <header class="hud">
    <div class="counter"><div class="label">TODAY</div><div class="value">1.24M</div></div>
    <div class="counter"><div class="label">5H</div><div class="value">412.8k</div></div>
    <button type="button" class="q-chip"><span id="ask-ico"></span>결정 대기 2</button>
    <button type="button" class="diag-chip" id="chip" aria-haspopup="dialog" aria-expanded="false" aria-controls="diag-panel"></button>
    <span class="live">● LIVE</span>
  </header>
  <p style="color:var(--muted);font-size:11px">칩을 누르면 오른쪽에 진단 패널이 열립니다. Esc로 닫으면 칩으로 포커스가 돌아갑니다.</p>
</div>

<aside class="diag-panel" id="diag-panel" role="dialog" aria-modal="false" aria-labelledby="dp-title" hidden></aside>

<script>
const ICONS = {
  diag:  [".......","..x....","..x....","..xx...","xx.x.xx","...xx..","....x.."],
  ok:    [".......","......x",".....x.","x...x..",".x.x...","..x....","......."],
  warn:  ["...x...","..xxx..","..x.x..",".xx.xx.",".xxxxx.","xxx.xxx","xxxxxxx"],
  fail:  ["xxxxxxx","x.xxx.x","xx.x.xx","xxx.xxx","xx.x.xx","x.xxx.x","xxxxxxx"],
  close: ["x.....x",".x...x.","..x.x..","...x...","..x.x..",".x...x.","x.....x"],
  ask:   [".aaaa..","a....a.","....a..","...a...","...a...",".......","...a..."],
  reload:["..xxxx.",".x....x","x......","x....xx","x....x.",".x...x.","..xxx.."],
  down:  ["...x...","...x...","...x...","x..x..x",".x.x.x.","..xxx..","xxxxxxx"],
};
const C = { ok: "#39ffb6", warn: "#fff7a8", fail: "#ff5a5a" };
function icon(n, ink = "currentColor", cls = "") {
  let s = ""; ICONS[n].forEach((r, y) => [...r].forEach((ch, x) => { if (ch !== ".") s += `<rect x="${x}" y="${y}" width="1" height="1" fill="${ink}"/>`; }));
  return `<svg class="px ${cls}" viewBox="0 0 7 7" aria-hidden="true">${s}</svg>`;
}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
$("#ask-ico").innerHTML = icon("ask", "#1d1b33");

/* 가짜 DiagnosticsSummary — doctor 항목 순서는 node, app, port, claude_home, claude_cli, plugin, managed, proxy, hooks, statusline */
const MIXED = {
  errorsLastHour: 3, logDir: "~/.claude-office/logs",
  hooks: { total: 128, last10min: 5, lastAt: new Date(Date.now() - 2 * 60000).toISOString(), rejected: { "403": 0, "415": 0, "413": 0, "400": 0 } },
  doctor: [
    { id: "node", status: "ok", title: "Node 버전", detail: "v24.1.0", fix: "" },
    { id: "app", status: "ok", title: "프로그램 파일", detail: "있음", fix: "" },
    { id: "port", status: "ok", title: "포트 4317", detail: "이 프로그램이 사용 중", fix: "" },
    { id: "claude_home", status: "ok", title: "Claude Code 데이터 폴더", detail: "세션 2개, 프로젝트 3개", fix: "" },
    { id: "claude_cli", status: "ok", title: "claude 명령", detail: "있음", fix: "" },
    { id: "plugin", status: "ok", title: "claude-office 플러그인", detail: "켜져 있음", fix: "" },
    { id: "managed", status: "fail", title: "회사 관리자 설정", detail: "관리자 설정이 플러그인 hook을 막고 있습니다", fix: "사용설명서 부록 A를 회사 관리자에게 전달해 주세요" },
    { id: "proxy", status: "warn", title: "프록시", detail: "NO_PROXY에 127.0.0.1이 없습니다", fix: "NO_PROXY에 127.0.0.1,localhost를 추가해 주세요" },
    { id: "hooks", status: "ok", title: "hook 수신", detail: "최근 10분 5건", fix: "" },
    { id: "statusline", status: "ok", title: "요금제 한도(선택)", detail: "없음", fix: "PLAN 바(요금제 한도)는 베타에서 지원하지 않습니다. 회사 좌석에서는 대부분 표시되지 않습니다" },  // B12: 베타에서는 정보(ok)
  ],
};
const ALLOK = { ...MIXED, errorsLastHour: 0, doctor: MIXED.doctor.map((d) => ({ ...d, status: "ok", fix: "", detail: d.id === "managed" ? "없음" : d.id === "proxy" ? "프록시 없음" : d.detail })) };

const RANK = { fail: 0, warn: 1, ok: 2 };
const LABEL = { fail: "문제", warn: "확인 필요", ok: "정상" };
function ago(iso) {
  if (!iso) return null;
  const s = Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 1000));
  return s < 60 ? "방금" : s < 3600 ? `${Math.floor(s / 60)}분 전` : `${Math.floor(s / 3600)}시간 전`;
}
function hookLine(h) {
  const rej = Object.values(h.rejected).reduce((a, b) => a + b, 0);
  const last = ago(h.lastAt);
  return `최근 10분 ${h.last10min}건, ${last ? `마지막 수신 ${last}` : "마지막 수신 없음"}, 거부 ${rej}건`;
}

const state = { open: false, err: 3, data: "mixed", bundle: "idle" };

function renderChip() {
  const n = state.err;
  $("#chip").innerHTML = `${icon("diag")}진단${n > 0 ? '<span class="diag-dot" aria-hidden="true"></span>' : ""}`;
  $("#chip").setAttribute("aria-label", n > 0 ? `진단 열기, 최근 1시간 오류 ${n}건` : "진단 열기");
  $("#chip").setAttribute("aria-expanded", String(state.open));
}

function bundleHtml() {
  const b = state.bundle;
  const btn = b === "busy"
    ? `<button type="button" class="pbtn pbtn--primary" disabled aria-busy="true">만드는 중…</button>`
    : `<button type="button" class="pbtn pbtn--primary" data-make>${b === "done" ? "다시 만들기" : "진단 파일 만들기"}</button>`;
  const file = "claude-office-diag-20261001-143205.json";
  const extra = b === "done"
    ? `<div class="dp-result" role="status"><p>진단 파일을 만들었습니다</p><span class="name">~/.claude-office/diagnostics/${file}</span><a class="pbtn" href="/api/diagnostics/files/${file}" download>${icon("down")}받기</a></div>`
    : b === "fail"
    ? `<div class="dp-fail" role="alert">진단 파일을 만들지 못했습니다. 잠시 뒤 다시 눌러 주세요. 계속 안 되면 터미널에서 <code>claude-office diag</code>를 실행해 주세요.</div>`
    : "";
  return `<section class="dp-sec" aria-labelledby="dp-file-h"><h3 id="dp-file-h">진단 파일</h3>
    <p class="dp-note">문제가 생기면 이 파일을 만들어 담당자에게 보내 주세요. 대화 내용, 이름, 비밀값은 들어가지 않습니다.</p>${btn}${extra}</section>`;
}

function renderPanel() {
  const p = $("#diag-panel");
  p.hidden = !state.open;
  if (!state.open) return;
  const head = `<header class="dp-head">${icon("diag", "#3fd0ff", "ico")}<h2 class="dp-title" id="dp-title" tabindex="-1">진단</h2>
    <span class="dp-checked">${state.data === "loading" ? "" : "14:32 확인"}</span>
    <button type="button" class="icon-btn" aria-label="다시 확인" data-reload>${icon("reload")}</button>
    <button type="button" class="icon-btn" aria-label="닫기" data-close>${icon("close")}</button></header>`;
  let body;
  if (state.data === "loading") body = `<div class="dp-state" role="status">진단 정보를 불러오는 중…</div>`;
  else if (state.data === "fetcherr") body = `<div class="dp-state err" role="alert">진단 정보를 가져오지 못했습니다. 서버가 켜져 있는지 확인해 주세요.<br><button type="button" class="pbtn" data-reload>다시 시도</button></div>`;
  else {
    const d = state.data === "allok" ? ALLOK : { ...MIXED, errorsLastHour: state.err };
    const items = d.doctor.map((x, i) => ({ ...x, i })).sort((a, b) => RANK[a.status] - RANK[b.status] || a.i - b.i);
    const f = items.filter((x) => x.status === "fail").length, w = items.filter((x) => x.status === "warn").length;
    const verdict = f ? ["fail", `문제 ${f}개를 찾았습니다`] : w ? ["warn", `확인할 항목이 ${w}개 있습니다`] : ["ok", "모두 정상입니다"];
    body = `
      <section class="dp-sec"><div class="dp-verdict ${verdict[0]}" role="status">${icon(verdict[0], C[verdict[0]])}${verdict[1]}</div></section>
      <section class="dp-sec" aria-labelledby="dp-err-h"><h3 id="dp-err-h">최근 오류</h3>
        <p class="dp-line ${d.errorsLastHour ? "err" : ""}">${d.errorsLastHour ? `최근 1시간 오류 <b>${d.errorsLastHour}건</b>` : "최근 1시간 오류 없음"}</p>
        <p class="dp-sub">로그 폴더 ${esc(d.logDir)}</p></section>
      <section class="dp-sec" aria-labelledby="dp-hook-h"><h3 id="dp-hook-h">hook 수신</h3><p class="dp-line">${hookLine(d.hooks)}</p></section>
      <section class="dp-sec" aria-labelledby="dp-doc-h"><h3 id="dp-doc-h">점검 결과</h3>
        <ul class="dp-rows">${items.map((x) => `<li class="dp-row dp-row--${x.status}">${icon(x.status, C[x.status])}<span class="t"><span class="sr-only">${LABEL[x.status]}: </span>${esc(x.title)}</span><span class="d">${esc(x.detail)}</span>${x.status !== "ok" && x.fix ? `<span class="f">${esc(x.fix)}</span>` : ""}</li>`).join("")}</ul></section>
      ${bundleHtml()}`;
  }
  p.innerHTML = head + `<div class="dp-scroll">${body}</div>`;
}
function render() { renderChip(); renderPanel(); }
function openPanel() { state.open = true; render(); $("#dp-title").focus({ preventScroll: true }); }
function closePanel() { state.open = false; render(); $("#chip").focus(); }

document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("#chip")) return state.open ? closePanel() : openPanel();
  if (t.closest("[data-close]")) return closePanel();
  if (t.closest("[data-make]")) { state.bundle = "busy"; $("#p-bundle").value = "busy"; render(); setTimeout(() => { state.bundle = "done"; $("#p-bundle").value = "done"; render(); document.querySelector(".dp-result a")?.focus(); }, 1200); return; }
  if (t.closest("[data-reload]")) { const k = state.data; state.data = "loading"; render(); setTimeout(() => { state.data = k === "loading" || k === "fetcherr" ? "mixed" : k; render(); }, 600); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.open) closePanel(); });
$("#p-err").onchange = (e) => { state.err = Number(e.target.value); render(); };
$("#p-data").onchange = (e) => { state.data = e.target.value; if (!state.open) openPanel(); else render(); };
$("#p-bundle").onchange = (e) => { state.bundle = e.target.value; if (!state.open) openPanel(); else render(); };
render();
</script>
</body>
</html>
