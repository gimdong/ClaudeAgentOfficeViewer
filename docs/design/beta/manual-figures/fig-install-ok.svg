<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 622" role="img" aria-labelledby="fig-install-ok-t fig-install-ok-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-install-ok-t">설치 성공 화면</title>
<desc id="fig-install-ok-d">설치 스크립트가 끝나면 환경 점검 결과와 '설치 완료' 줄이 나옵니다. 포트와 실시간 이벤트의 경고는 설치 직후에는 정상입니다.</desc>
<rect x="0" y="0" width="640" height="622" fill="#12111f"/><rect x="1" y="1" width="638" height="620" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="38" y="19" width="3" height="3" fill="#39ffb6"/><rect x="35" y="22" width="3" height="3" fill="#39ffb6"/><rect x="20" y="25" width="3" height="3" fill="#39ffb6"/><rect x="32" y="25" width="3" height="3" fill="#39ffb6"/><rect x="23" y="28" width="3" height="3" fill="#39ffb6"/><rect x="29" y="28" width="3" height="3" fill="#39ffb6"/><rect x="26" y="31" width="3" height="3" fill="#39ffb6"/><text x="48" y="34" font-size="16" fill="#39ffb6" font-weight="700">이렇게 보이면 성공</text><rect x="20" y="48" width="600" height="504" fill="#0b0a17" stroke="#39ffb6" stroke-width="2"/><rect x="21" y="49" width="598" height="24" fill="#241f40"/><rect x="30" y="57" width="8" height="8" fill="#ff5fa2"/><rect x="44" y="57" width="8" height="8" fill="#fff7a8"/><rect x="58" y="57" width="8" height="8" fill="#39ffb6"/><text x="320" y="65" font-size="11" fill="#9d97c7" text-anchor="middle">터미널</text><text x="32" y="99" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ sh install.sh</text><text x="32" y="119" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">/Users/fakeuser/.zshrc에 claude-office 명령 경로를 추가할까요? [y/N] y</text><text x="32" y="139" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">Claude Code 플러그인(claude-office)을 설치할까요? 도구 사용 기록을</text><text x="32" y="159" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  이 PC의 뷰어로 보내고, 대시보드에서 답한 허용·거부를 Claude Code에</text><text x="32" y="179" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  돌려줍니다. [y/N] y</text><text x="32" y="199" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ Node.js: 버전 24</text><text x="32" y="219" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 프로그램 파일: 있음</text><rect x="24" y="225" width="592" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="32" y="239" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">⚠️ 포트: 서버가 꺼져 있습니다(4317)</text><rect x="24" y="245" width="592" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="32" y="259" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  → claude-office 명령으로 대시보드를 켜 주세요.</text><text x="32" y="279" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ Claude 데이터 폴더: 세션 2개, 프로젝트 3개</text><text x="32" y="299" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ Claude Code: 있음</text><text x="32" y="319" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 플러그인: 켜져 있음</text><text x="32" y="339" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 대시보드 열쇠: 있음</text><text x="32" y="359" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ hook 열쇠: 있음</text><text x="32" y="379" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 결정 대기 시간: 600초</text><text x="32" y="399" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ hook 실행: Node.js 경로 확인됨</text><text x="32" y="419" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ hook 전달: 최근 24시간 실패 없음</text><text x="32" y="439" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 회사 관리자 설정: 파일 없음(회사가 다른 방식으로 정책을 배포했을 수 있음)</text><text x="32" y="459" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 프록시: 없음</text><rect x="24" y="465" width="592" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="32" y="479" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">⚠️ 실시간 이벤트: 서버가 꺼져 있어 확인하지 못했습니다</text><rect x="24" y="485" width="592" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="32" y="499" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  → 대시보드를 켠 뒤 다시 확인해 주세요.</text><text x="32" y="519" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 요금제 한도(선택): 없음</text><rect x="24" y="525" width="592" height="20" fill="#39ffb6" fill-opacity="0.14"/><text x="32" y="539" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">설치 완료. 새 터미널에서 claude-office 를 실행하세요.</text><rect x="20" y="566" width="12" height="12" fill="#fff7a8" fill-opacity="0.35"/><text x="40" y="577" font-size="13" fill="#e8e4ff">노란 줄(포트, 실시간 이벤트)은 설치 직후에 나와도 괜찮습니다.</text><rect x="20" y="590" width="12" height="12" fill="#39ffb6" fill-opacity="0.35"/><text x="40" y="601" font-size="13" fill="#e8e4ff">마지막 줄에 “설치 완료”가 보이면 설치에 성공한 것입니다.</text>
</svg>
