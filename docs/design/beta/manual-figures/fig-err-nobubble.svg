<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" role="img" aria-labelledby="fig-err-nobubble-t fig-err-nobubble-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-err-nobubble-t">증상: 말풍선과 손들기가 보이지 않음</title>
<desc id="fig-err-nobubble-d">claude-office doctor 결과에서 실시간 이벤트가 0건이면 Claude Code의 작업 소식이 대시보드에 도착하지 않는 것입니다.</desc>
<rect x="0" y="0" width="640" height="216" fill="#12111f"/><rect x="1" y="1" width="638" height="214" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="16" y="16" width="608" height="184" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><rect x="17" y="17" width="606" height="24" fill="#241f40"/><rect x="26" y="25" width="8" height="8" fill="#ff5fa2"/><rect x="40" y="25" width="8" height="8" fill="#fff7a8"/><rect x="54" y="25" width="8" height="8" fill="#39ffb6"/><text x="320" y="33" font-size="11" fill="#9d97c7" text-anchor="middle">터미널</text><text x="28" y="67" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ claude-office doctor</text><text x="28" y="87" font-size="12" fill="#9d97c7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">(중간 생략)</text><text x="28" y="107" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">✅ 회사 관리자 설정: 파일 없음(회사가 다른 방식으로 정책을 배포했을 수 있음)</text><rect x="20" y="113" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="127" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">⚠️ 실시간 이벤트: 받은 이벤트 0건</text><rect x="20" y="133" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="147" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  → Claude Code 세션에서 아무 작업이나 해 보세요. 그래도 0건이면 플러그인과</text><rect x="20" y="153" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="167" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">    회사 관리자 설정 항목을 확인해 주세요. 그래도 안 되면 회사 관리자에게</text><rect x="20" y="173" width="600" height="20" fill="#fff7a8" fill-opacity="0.14"/><text x="28" y="187" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">    사용설명서 부록 A를 전달해 주세요.</text>
</svg>
