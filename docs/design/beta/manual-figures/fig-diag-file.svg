pace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace">~/.claude-office/diagnostics/</text><text x="414" y="114" font-size="10" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace">claude-office-diag-</text><text x="414" y="128" font-size="10" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace">20261001-093000.json</text><rect x="414" y="138" width="64" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><rect x="428" y="144" width="2" height="2" fill="#e8e4ff"/><rect x="428" y="146" width="2" height="2" fill="#e8e4ff"/><rect x="428" y="148" width="2" height="2" fill="#e8e4ff"/><rect x="422" y="150" width="2" height="2" fill="#e8e4ff"/><rect x="428" y="150" width="2" height="2" fill="#e8e4ff"/><rect x="434" y="150" width="2" height="2" fill="#e8e4ff"/><rect x="424" y="152" width="2" height="2" fill="#e8e4ff"/><rect x="428" y="152" width="2" height="2" fill="#e8e4ff"/><rect x="432" y="152" width="2" height="2" fill="#e8e4ff"/><rect x="426" y="154" width="6" height="2" fill="#e8e4ff"/><rect x="422" y="156" width="14" height="2" fill="#e8e4ff"/><text x="442" y="156" font-size="12" fill="#e8e4ff">받기</text><text x="320" y="212" font-size="15" fill="#e8e4ff" font-weight="700" text-anchor="middle">받은 파일을 담당자에게 보내 주세요</text><rect x="16" y="234" width="608" height="124" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><rect x="17" y="235" width="606" height="24" fill="#241f40"/><rect x="26" y="243" width="8" height="8" fill="#ff5fa2"/><rect x="40" y="243" width="8" height="8" fill="#fff7a8"/><rect x="54" y="243" width="8" height="8" fill="#39ffb6"/><text x="320" y="251" font-size="11" fill="#9d97c7" text-anchor="middle">터미널에서 만들 때</text><text x="28" y="285" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ claude-office diag</text><text x="28" y="305" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">진단 파일을 만들었습니다: /Users/fakeuser/.claude-office/diagnostics/</text><text x="28" y="325" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">claude-office-diag-20261001-093000.json</text><text x="28" y="345" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">이 파일을 담당자에게 보내 주세요. 대화 내용, 이름, 비밀값은 들어 있지 않습니다.</text>
