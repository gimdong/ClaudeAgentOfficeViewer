<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" role="img" aria-labelledby="fig-diag-file-t fig-diag-file-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-diag-file-t">진단 파일 만들기</title>
<desc id="fig-diag-file-d">진단 패널에서 진단 파일 만들기 버튼을 누르고, 만드는 중 표시가 끝나면 파일 위치와 받기 단추가 나옵니다. 받기를 눌러 파일을 받습니다. 터미널에서는 claude-office diag 명령으로 같은 파일을 만들 수 있습니다.</desc>
