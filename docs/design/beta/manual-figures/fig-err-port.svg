<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-labelledby="fig-err-port-t fig-err-port-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-err-port-t">증상: 포트가 이미 사용 중</title>
<desc id="fig-err-port-d">claude-office를 켤 때 4317번 포트를 다른 프로그램이 쓰고 있으면 켜지지 않습니다. doctor 결과에도 포트 항목이 실패로 나옵니다.</desc>
<rect x="0" y="0" width="640" height="236" fill="#12111f"/><rect x="1" y="1" width="638" height="234" fill="none" stroke="#3b3460" stroke-width="2"/>
<rect x="16" y="16" width="608" height="204" fill="#0b0a17" stroke="#3b3460" stroke-width="2"/><rect x="17" y="17" width="606" height="24" fill="#241f40"/><rect x="26" y="25" width="8" height="8" fill="#ff5fa2"/><rect x="40" y="25" width="8" height="8" fill="#fff7a8"/><rect x="54" y="25" width="8" height="8" fill="#39ffb6"/><text x="320" y="33" font-size="11" fill="#9d97c7" text-anchor="middle">터미널</text><text x="28" y="67" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ claude-office</text><rect x="20" y="73" width="600" height="20" fill="#ff5a5a" fill-opacity="0.14"/><text x="28" y="87" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">포트 4317번이 이미 사용 중입니다. --port 로 다른 포트를 지정하세요.</text><text x="28" y="107" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve"></text><text x="28" y="127" font-size="12" fill="#39ffb6" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">$ claude-office doctor</text><text x="28" y="147" font-size="12" fill="#9d97c7" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">(중간 생략)</text><rect x="20" y="153" width="600" height="20" fill="#ff5a5a" fill-opacity="0.14"/><text x="28" y="167" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">❌ 포트: 다른 프로그램이 4317을 쓰고 있습니다</text><rect x="20" y="173" width="600" height="20" fill="#ff5a5a" fill-opacity="0.14"/><text x="28" y="187" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">  → 그 프로그램을 끄거나 다른 포트로 켜 주세요. 다른 포트에서는 말풍선·손들기가</text><rect x="20" y="193" width="600" height="20" fill="#ff5a5a" fill-opacity="0.14"/><text x="28" y="207" font-size="12" fill="#e8e4ff" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'D2Coding', monospace" xml:space="preserve">    보이지 않습니다(플러그인은 4317로 보냄).</text>
</svg>
