<title id="fig-floor-switch-t">층 스위치와 멈춘 층</title>
<desc id="fig-floor-switch-d">층 머리의 스위치를 누르면 영업 중에서 멈춤으로 바뀝니다. 멈춘 층은 칩이 멈춤이 되고, 방 전체에 휴업 팻말이 달린 셔터가 내려와 빈 책상만 비치며, 멈춘 뒤 막힌 도구 호출 수가 칩 옆에 보입니다. 멈춤은 Claude가 다음에 도구를 쓰려 할 때부터 막습니다.</desc>
