<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 542.4" role="img" aria-labelledby="fig-floor-terminate-t fig-floor-terminate-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-floor-terminate-t">층 종료 확인 창 두 단계</title>
<desc id="fig-floor-terminate-d">종료를 누르면 층 이름, 폴더, 구성원 수와 함께 끌지 묻는 창이 열립니다. 이 대시보드를 켠 세션이면 경고 한 줄이 더 나옵니다. 끄기를 누른 뒤 10초가 지나도 켜져 있으면 강제로 끌지 한 번 더 묻습니다.</desc>
<rect x="0" y="0" width="640" height="542.4" fill="#12111f"/><rect x="1" y="1" width="638" height="540.4" fill="none" stroke="#3b3460" stroke-width="2"/>
<text x="16" y="30" font-size="12" fill="#3fd0ff">① 층 머리의 [종료]를 누르면</text><rect x="110" y="276" width="420" height="6" fill="#0b0a17"/><rect x="110" y="44" width="420" height="232" fill="#0e0d18"/><rect x="112" y="46" width="416" height="228" fill="none" stroke="#ff5fa2" stroke-width="4"/><text x="130" y="80" font-size="17" fill="#e8e4ff" font-weight="700">fake-shop 층을 끌까요?</text><text x="130" y="102" font-size="12" fill="#9d97c7">폴더</text><text x="186" y="102" font-size="12" fill="#e8e4ff" font-family="ui-monospace, Menlo, monospace">~/Code/fake-shop</text><text x="130" y="122" font-size="12" fill="#9d97c7">구성원</text><text x="186" y="122" font-size="13" fill="#e8e4ff">팀원 3명 · 작업 중 1명</text><text x="130" y="152" font-size="14" fill="#e8e4ff">이 세션을 끕니다. 대화 기록은 남지만, 하던 작업은 끊깁니다.</text><rect x="130" y="161" width="2" height="44" fill="#fff7a8"/><text x="140" y="174" font-size="13" fill="#fff7a8">★ 지금 이 대시보드를 켠 세션입니다. 끄면 이 터미널의 Claude</text><text x="140" y="194" font-size="13" fill="#fff7a8">Code도 끝납니다.</text><rect x="362" y="256" width="70" height="2" fill="#0b0a17"/><rect x="363" y="221" width="68" height="34" fill="#0e0d18" stroke="#3fd0ff" stroke-width="2"/><text x="397" y="242.68" font-size="13" fill="#e8e4ff" text-anchor="middle">취소</text><rect x="440" y="256" width="70" height="2" fill="#0b0a17"/><rect x="441" y="221" width="68" height="34" fill="#0e0d18" stroke="#ff5fa2" stroke-width="2"/><text x="475" y="242.68" font-size="13" fill="#ff5fa2" text-anchor="middle">끄기</text><text x="16" y="302" font-size="12" fill="#3fd0ff">② [끄기] 뒤 10초가 지나도 켜져 있으면</text><line x1="320" y1="284" x2="320" y2="302" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="6 4"/><polygon points="320,312 315,302 325,302" fill="#3fd0ff"/><rect x="110" y="472.4" width="420" height="6" fill="#0b0a17"/><rect x="110" y="316" width="420" height="156.39999999999998" fill="#0e0d18"/><rect x="112" y="318" width="416" height="152.39999999999998" fill="none" stroke="#ff5fa2" stroke-width="4"/><text x="130" y="352" font-size="17" fill="#e8e4ff" font-weight="700">fake-shop 층이 아직 끝나지 않았습니다</text><text x="130" y="374" font-size="14" fill="#e8e4ff">아직 켜져 있습니다. 강제로 끌까요? 저장되지 않은 작업이</text><text x="130" y="396.4" font-size="14" fill="#e8e4ff">사라질 수 있습니다.</text><rect x="322" y="452.4" width="70" height="2" fill="#0b0a17"/><rect x="323" y="417.4" width="68" height="34" fill="#0e0d18" stroke="#3fd0ff" stroke-width="2"/><text x="357" y="439.08" font-size="13" fill="#e8e4ff" text-anchor="middle">취소</text><rect x="400" y="452.4" width="110" height="2" fill="#0b0a17"/><rect x="401" y="417.4" width="108" height="34" fill="#0e0d18" stroke="#ff5fa2" stroke-width="2"/><text x="455" y="439.08" font-size="13" fill="#ff5fa2" text-anchor="middle">강제로 끄기</text><text x="16" y="502.4" font-size="12" fill="#9d97c7">★ 경고는 이 대시보드를 켠 세션(층 이름 앞의 ★)일 때만 보입니다. 처음 포커스는 [취소]입니다(하늘 테두리).</text><text x="16" y="522.4" font-size="12" fill="#9d97c7">끄지 못하면 창 안에 안내가 나옵니다: 이 세션의 프로세스를 확인하지 못해 끄지 않았습니다. 터미널에서 직접 끝내 주세요.</text>
</svg>
