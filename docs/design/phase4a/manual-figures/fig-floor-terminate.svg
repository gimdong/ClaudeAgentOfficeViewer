<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 609.5999999999999" role="img" aria-labelledby="fig-floor-terminate-t fig-floor-terminate-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-floor-terminate-t">층 종료 확인 창 두 단계</title>
<desc id="fig-floor-terminate-d">종료를 누르면 층 이름, 폴더, 구성원 수와 함께 끌지 묻는 창이 열립니다. 이 대시보드를 켠 세션이면 경고 한 줄이 더 나옵니다. 끄기를 누른 뒤 10초가 지나도 켜져 있으면 강제로 끌지 한 번 더 묻습니다.</desc>
<rect x="0" y="0" width="640" height="609.5999999999999" fill="#12111f"/><rect x="1" y="1" width="638" height="607.5999999999999" fill="none" stroke="#3b3460" stroke-width="2"/>
<text x="16" y="30" font-size="12" fill="#3fd0ff">① 층 머리의 [종료]를 누르면</text><rect x="110" y="343.2" width="420" height="6" fill="#0b0a17"/><rect x="110" y="44" width="420" height="299.2" fill="#0e0d18"/><rect x="112" y="46" width="416" height="295.2" fill="none" stroke="#ff5fa2" stroke-width="4"/><text x="130" y="80" font-size="17" fill="#e8e4ff" font-weight="700">fake-shop 층을 끌까요?</text><text x="130" y="102" font-size="12" fill="#9d97c7">폴더</text><text x="186" y="102" font-size="12" fill="#e8e4ff" font-family="ui-monospace, Menlo, monospace">~/Code/fake-shop</text><text x="130" y="122" font-size="12" fill="#9d97c7">구성원</text><text x="186" y="122" font-size="13" fill="#e8e4ff">팀원 3명 · 작업 중 1명</text><text x="130" y="152" font-size="14" fill="#e8e4ff">이 세션의 Claude Code를 끕니다. 하던 작업과 같은 창 안의</text><text x="130" y="174.4" font-size="14" fill="#e8e4ff">팀원·서브에이전트도 함께 끝납니다. 대화 기록은 남아 있어,</text><text x="130" y="196.8" font-size="14" fill="#e8e4ff">그 폴더의 터미널에서 claude --resume으로 다시 열면 이</text><text x="130" y="219.2" font-size="14" fill="#e8e4ff">층도 다시 나타납니다.</text><rect x="130" y="228.2" width="2" height="44" fill="#fff7a8"/><text x="140" y="241.2" font-size="13" fill="#fff7a8">★ 지금 이 대시보드를 켠 세션입니다. 끄면 이 터미널의 Claude</text><text x="140" y="261.2" font-size="13" fill="#fff7a8">Code도 끝납니다.</text><rect x="362" y="323.2" width="70" height="2" fill="#0b0a17"/><rect x="363" y="288.2" width="68" height="34" fill="#0e0d18" stroke="#3fd0ff" stroke-width="2"/><text x="397" y="309.88" font-size="13" fill="#e8e4ff" text-anchor="middle">취소</text><rect x="440" y="323.2" width="70" height="2" fill="#0b0a17"/><rect x="441" y="288.2" width="68" height="34" fill="#0e0d18" stroke="#ff5fa2" stroke-width="2"/><text x="475" y="309.88" font-size="13" fill="#ff5fa2" text-anchor="middle">끄기</text><text x="16" y="369.2" font-size="12" fill="#3fd0ff">② [끄기] 뒤 10초가 지나도 켜져 있으면</text><line x1="320" y1="351.2" x2="320" y2="369.2" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="6 4"/><polygon points="320,379.2 315,369.2 325,369.2" fill="#3fd0ff"/><rect x="110" y="539.5999999999999" width="420" height="6" fill="#0b0a17"/><rect x="110" y="383.2" width="420" height="156.39999999999992" fill="#0e0d18"/><rect x="112" y="385.2" width="416" height="152.39999999999992" fill="none" stroke="#ff5fa2" stroke-width="4"/><text x="130" y="419.2" font-size="17" fill="#e8e4ff" font-weight="700">fake-shop 층이 아직 끝나지 않았습니다</text><text x="130" y="441.2" font-size="14" fill="#e8e4ff">아직 켜져 있습니다. 강제로 끌까요? 저장되지 않은 작업이</text><text x="130" y="463.59999999999997" font-size="14" fill="#e8e4ff">사라질 수 있습니다.</text><rect x="322" y="519.5999999999999" width="70" height="2" fill="#0b0a17"/><rect x="323" y="484.59999999999997" width="68" height="34" fill="#0e0d18" stroke="#3fd0ff" stroke-width="2"/><text x="357" y="506.28" font-size="13" fill="#e8e4ff" text-anchor="middle">취소</text><rect x="400" y="519.5999999999999" width="110" height="2" fill="#0b0a17"/><rect x="401" y="484.59999999999997" width="108" height="34" fill="#0e0d18" stroke="#ff5fa2" stroke-width="2"/><text x="455" y="506.28" font-size="13" fill="#ff5fa2" text-anchor="middle">강제로 끄기</text><text x="16" y="569.5999999999999" font-size="12" fill="#9d97c7">★ 경고는 이 대시보드를 켠 세션(층 이름 앞의 ★)일 때만 보입니다. 처음 포커스는 [취소]입니다(하늘 테두리).</text><text x="16" y="589.5999999999999" font-size="12" fill="#9d97c7">끄지 못하면 창 안에 안내가 나옵니다: 이 세션의 프로세스를 확인하지 못해 끄지 않았습니다. 터미널에서 직접 끝내 주세요.</text>
</svg>
