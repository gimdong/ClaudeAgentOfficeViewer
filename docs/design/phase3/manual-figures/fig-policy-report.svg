<desc id="fig-policy-report-d">항상 질문으로 정해 둔 도구를 쓰려 하면 결정 보고서가 열리고, 이유 줄에 권한 정책이 매번 확인하도록 정해 둔 도구입니다가 보입니다. 허용은 이번 한 번만 허용하며 정책은 바뀌지 않습니다. 머리의 권한 단추를 누르면 이 에이전트의 권한 칸이 열립니다.</desc>
