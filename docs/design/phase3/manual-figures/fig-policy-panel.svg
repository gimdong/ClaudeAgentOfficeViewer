">팀원</text><text x="270" y="68" font-size="17" fill="#e8e4ff" font-weight="700">reviewer</text><text x="270" y="86" font-size="11" fill="#9d97c7">이 이름의 정책은 다른 세션의 같은 이름에도 적용됩니다</text><rect x="585" y="29" width="26" height="26" fill="none" stroke="#3b3460" stroke-width="2"/><rect x="591" y="35" width="2" height="2" fill="#e8e4ff"/><rect x="603" y="35" width="2" height="2" fill="#e8e4ff"/><rect x="593" y="37" width="2" height="2" fill="#e8e4ff"/><rect x="601" y="37" width="2" height="2" fill="#e8e4ff"/><rect x="595" y="39" width="2" height="2" fill="#e8e4ff"/><rect x="599" y="39" width="2" height="2" fill="#e8e4ff"/><rect x="597" y="41" width="2" height="2" fill="#e8e4ff"/><rect x="595" y="43" width="2" height="2" fill="#e8e4ff"/><rect x="599" y="43" width="2" height="2" fill="#e8e4ff"/><rect x="593" y="45" width="2" height="2" fill="#e8e4ff"/><rect x="601" y="45" width="2" height="2" fill="#e8e4ff"/><rect x="591" y="47" width="2" height="2" fill="#e8e4ff"/><rect x="603" y="47" width="2" height="2" fill="#e8e4ff"/><rect x="200" y="102" width="426" height="2" fill="#3b3460"/><text x="214" y="128" font-size="12" fill="#9d97c7">켠 뒤로 막거나 물은 적 없음</text><text x="214" y="146" font-size="10" fill="#9d97c7">대시보드를 다시 켜면 0부터 셉니다</text><line x1="214" y1="162" x2="612" y2="162" stroke="#3b3460" stroke-dasharray="3 3"/><text x="214" y="182" font-size="11" fill="#9d97c7">바로 쓰는 묶음</text><rect x="214" y="218" width="69" height="2" fill="#0b0a17"/><rect x="215" y="191" width="67" height="26" fill="#0e0d18" stroke="#3fd0ff" stroke-width="2"/><text x="224" y="208.32" font-size="12" fill="#e8e4ff">읽기 전용</text><rect x="289" y="218" width="103" height="2" fill="#0b0a17"/><rect x="290" y="191" width="101" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="299" y="208.32" font-size="12" fill="#e8e4ff">명령은 물어보고</text><rect x="398" y="218" width="69" height="2" fill="#0b0a17"/><rect x="399" y="191" width="67" height="26" fill="#0e0d18" stroke="#3b3460" stroke-width="2"/><text x="408" y="208.32" font-size="12" fill="#e8e4ff">제한 없음</text><text x="214" y="238" font-size="12" fill="#9d97c7">누르면 아래 칸이 모두 그 조합으로 바뀝니다. [저장]을 눌러야 적용됩니다.</text><line x1="214" y1="254" x2="612" y2="254" stroke="#3b3460" stroke-dasharray="3 3"/><text x="214" y="274" font-size="11" fill="#9d97c7">도구별 권한</text><rect x="214" y="286" width="2" height="28" fill="#fff7a8"/><text x="222" y="305" font-size="12" fill="#e8e4ff">명령 실행</text><rect x="417" y="287" width="50" height="26" fill="none" stroke="#3b3460" stroke-width="2"/><rect x="426.1" y="297.5" width="5" height="5" fill="none" stroke="#9d97c7" stroke-width="1"/><text x="435.6" y="305" font-size="12" fill="#9d97c7">기본</text><rect x="473" y="287" width="82" height="26" fill="none" stroke="#3b3460" stroke-width="2"/><rect x="484.9" y="297.5" width="5" height="5" fill="none" stroke="#9d97c7" stroke-width="1"/><text x="494.4" y="305" font-size="12" fill="#9d97c7">항상 질문</text><rect x="561" y="287" width="50" height="26" fill="#1c1a2c" stroke="#ff5fa2" stroke-width="2"/><rect x="569.6" y="297" width="6" height="6" fill="#ff5fa2"/><text x="579.6" y="305" font-size="12" fill="#ff5fa2" font-weight="700">금지</text><rect x="214" y="322" width="2" height="28" fill="#fff7a8"/><text x="222" y="341" font-size="12" fill="#e8e4ff">파일 고치기</text><rect x="417" y="323" width="50" height="26" fill="none" stroke="#3b3460" stroke-width="2"/><rect x="426.1" y="333.5" width="5" height="5" fill="none" stroke="#9d97c7" stroke-width="1"/><text x="435.6" y="341" font-size="12" fill="#9d97c7">기본</text><rect x="473" y="323" width="82" height="26" fill="none" stroke="#3b3460" stroke-width="2"/><rect x="484.9" y="333.5" width="5" height="5" fill="none" stroke="#9d97c7" stroke-width="1"/><text x="494.4" y="341" font-size="12" fill="#9d97c7">항상 질문</text><rect x="561" y="323" width="50" height="26" fill="#1c1a2c" stroke="#ff5fa2" stroke-width="2"/><rect x="569.6" y="333" width="6" height="6" fill="#ff5fa2"/><text x="579.6" y="341" font-size="12" fill=