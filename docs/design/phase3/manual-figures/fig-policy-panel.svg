1" y="521.5" width="5" height="5" fill="none" stroke="#9d97c7" stroke-width="1"/><text x="579.6" y="529" font-size="12" fill="#9d97c7">금지</text><text x="214" y="554" font-size="12" fill="#9d97c7">&quot;모든 도구&quot;는 위에서 기본으로 둔 도구에 적용됩니다.</text><text x="214" y="576" font-size="12" fill="#9d97c7">사용자에게 묻기(질문·계획 승인), 팀원끼리 연락하기(메시지·할 일 목록),</text><text x="214" y="595.2" font-size="12" fill="#9d97c7">서브에이전트가 결과 돌려주기는 어떤 정책으로도 막지 않습니다.</text><rect x="200" y="686" width="426" height="2" fill="#3b3460"/><text x="214" y="720" font-size="13" fill="#fff7a8">저장하지 않은 변경이 있습니다</text><rect x="549" y="699" width="62" height="34" fill="#39ffb6" stroke="#39ffb6" stroke-width="2"/><text x="580" y="720.68" font-size="13" fill="#1d1b33" text-anchor="middle">저장</text><text x="16" y="318" font-size="12" fill="#3fd0ff">① 바로 쓰는 묶음을 누르면</text><text x="16" y="336" font-size="12" fill="#3fd0ff">   아래 칸이 한꺼번에 바뀝니다</text><line x1="120" y1="306" x2="203.38378362913153" y2="211.49837855365092" stroke="#3fd0ff" stroke-width="3" stroke-dasharray="6 4"/><polygon points="210,204 207.132972905957,214.80648673908516 199.63459435230607,208.1902703682167" fill="#3fd0ff"/><text x="16" y="696" font-size="12" fill="#3fd0ff">② [저장]을 눌러야</text><text x="16" y="714" font-size="12" fill="#3fd0ff">   적용됩니다</text>
