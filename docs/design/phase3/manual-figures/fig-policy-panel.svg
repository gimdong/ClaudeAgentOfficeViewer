<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" role="img" aria-labelledby="fig-policy-panel-t fig-policy-panel-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-policy-panel-t">에이전트 패널의 권한 칸</title>
<desc id="fig-policy-panel-d">캐릭터를 누르면 오른쪽에 그 에이전트의 권한 칸이 열립니다. 도구 묶음마다 기본, 항상 질문, 금지 중 하나를 고릅니다. 바로 쓰는 묶음 읽기 전용을 누르면 명령 실행과 파일 고치기가 금지로 바뀌고, 저장하지 않은 변경이 있다고 알려 줍니다. 저장을 눌러야 적용됩니다.</desc>
