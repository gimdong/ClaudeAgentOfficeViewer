<desc id="fig-policy-lock-d">권한 정책이 걸린 캐릭터의 책상에는 보라색 자물쇠가 붙습니다. 정책이 도구를 막으면 30초 동안 자물쇠가 분홍색으로 바뀌고 왼쪽에 느낌표가 붙습니다. 캐릭터에 마우스를 올리면 말풍선에 정책으로 막힘: 명령 실행처럼 무엇이 막혔는지 나옵니다.</desc>
