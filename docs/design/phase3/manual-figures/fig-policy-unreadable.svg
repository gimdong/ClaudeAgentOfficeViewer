<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545" role="img" aria-labelledby="fig-policy-unreadable-t fig-policy-unreadable-d" shape-rendering="crispEdges" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
<title id="fig-policy-unreadable-t">정책 파일을 읽지 못했을 때</title>
<desc id="fig-policy-unreadable-d">저장해 둔 정책 파일이 깨졌거나 읽을 권한이 없으면 위쪽 막대의 권한 정책 단추에 빨간 테두리와 삼각형이 생기고, 목록 맨 위에 정책 파일을 읽지 못함 경고가 보입니다. 이때는 정책이 적용되지 않습니다. 정책을 다시 정해 저장하면 예전 파일은 policy.json.broken으로 보관되고 경고가 사라집니다.</desc>
